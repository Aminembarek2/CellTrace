# Offline quality gates and the container demo. No job reads a provider key or calls a model.
# Third party actions are pinned to full commit hashes, with the release tag in a comment.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: offline evidence workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          python-version: "3.12"
          enable-cache: true
      # The same runner as local use, so CI and local checks share one stage list.
      - name: Lint, format, types, tests, demo, viewer and traces
        run: uv run --locked python scripts/run_quality_workflow.py --out "${{ runner.temp }}/workflow"
      - name: Keep the stage logs and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-workflow
          path: ${{ runner.temp }}/workflow
          retention-days: 14

  container:
    name: container builds and runs the demo without network
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: celltrace:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the demo with networking disabled
        # The container exits nonzero when any demo scenario fails.
        run: docker run --name celltrace-demo --network none celltrace:ci
      - name: Collect container evidence
        if: always()
        run: |
          docker logs celltrace-demo > "${{ runner.temp }}/container-demo.log" 2>&1
          docker cp celltrace-demo:/app/artifacts/public/demo "${{ runner.temp }}/container-demo"
          docker rm celltrace-demo
      - name: Check the collected summary
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          paths = list((Path(os.environ['RUNNER_TEMP']) / 'container-demo').rglob('demo_summary.json'))
          if len(paths) != 1:
              raise SystemExit(f'Expected one summary, found {len(paths)}')
          summary = json.loads(paths[0].read_text())
          print(summary['status'], len(summary['scenarios']), 'scenarios')
          if summary['status'] != 'passed' or len(summary['scenarios']) != 6:
              raise SystemExit('Offline container demo did not pass all six scenarios')
          PY
      - name: Keep the demo output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-demo
          path: |
            ${{ runner.temp }}/container-demo
            ${{ runner.temp }}/container-demo.log
          retention-days: 14
