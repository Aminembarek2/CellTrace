<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="466" viewBox="0 0 1000 466" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>CellTrace pipeline: measure, then investigate with code checked agents</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="998" height="464" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>

  <!-- Lane labels -->
  <text x="40" y="44" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#2563EB">1  MEASURE</text>
  <text x="40" y="222" font-size="11.5" font-weight="700" letter-spacing="1.6" fill="#7C3AED">2  INVESTIGATE</text>

  <!-- Lane 1 -->
  <g>
    <rect x="40" y="58" width="200" height="88" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="60" y="92" font-size="16" font-weight="600" fill="#0F172A">Phone traces</text>
    <text x="60" y="114" font-size="12.5" fill="#475569">5G, LTE and 3G drives,</text>
    <text x="60" y="131" font-size="12.5" fill="#475569">1 s samples, public archives</text>

    <rect x="280" y="58" width="200" height="88" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="300" y="92" font-size="16" font-weight="600" fill="#0F172A">DuckDB snapshot</text>
    <text x="300" y="114" font-size="12.5" fill="#475569">hashed, read only,</text>
    <text x="300" y="131" font-size="12.5" fill="#475569">original units kept</text>

    <rect x="520" y="58" width="200" height="88" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
    <text x="540" y="92" font-size="16" font-weight="600" fill="#0F172A">Population analytics</text>
    <text x="540" y="114" font-size="12.5" fill="#475569">chance checks, held out</text>
    <text x="540" y="131" font-size="12.5" fill="#475569">days, replication</text>

    <rect x="760" y="58" width="200" height="88" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="780" y="92" font-size="16" font-weight="600" fill="#0F172A">Incident queue</text>
    <text x="780" y="114" font-size="12.5" fill="#475569">sustained low rate</text>
    <text x="780" y="131" font-size="12.5" fill="#475569">episodes, not every dip</text>

    <line x1="240" y1="102" x2="276" y2="102" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="480" y1="102" x2="516" y2="102" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="720" y1="102" x2="756" y2="102" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  </g>

  <!-- Carriage return from queue to investigator -->
  <path d="M860,146 L860,180 Q860,190 850,190 L200,190 Q190,190 190,200 L190,232" fill="none" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="525" y="183" font-size="12" fill="#64748B" text-anchor="middle">one case per episode, bound to its snapshot and time window</text>

  <!-- Lane 2 -->
  <g>
    <rect x="40" y="236" width="200" height="88" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
    <text x="60" y="270" font-size="16" font-weight="600" fill="#0F172A">Investigator</text>
    <text x="60" y="292" font-size="12.5" fill="#475569">LLM with typed, read only</text>
    <text x="60" y="309" font-size="12.5" fill="#475569">SQL tools, no free SQL</text>

    <rect x="280" y="236" width="200" height="88" rx="12" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
    <text x="300" y="270" font-size="16" font-weight="600" fill="#0F172A">Reviewer</text>
    <text x="300" y="292" font-size="12.5" fill="#475569">optional second agent, runs</text>
    <text x="300" y="309" font-size="12.5" fill="#475569">its own measurement query</text>

    <rect x="520" y="236" width="200" height="88" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="540" y="270" font-size="16" font-weight="600" fill="#0F172A">Code verifier</text>
    <text x="540" y="292" font-size="12.5" fill="#475569">recomputes claimed numbers</text>
    <text x="540" y="309" font-size="12.5" fill="#475569">from cited evidence</text>

    <rect x="760" y="236" width="200" height="88" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="780" y="270" font-size="16" font-weight="600" fill="#0F172A">Report</text>
    <text x="780" y="292" font-size="12.5" fill="#475569">facts, hypotheses, missing</text>
    <text x="780" y="309" font-size="12.5" fill="#475569">evidence, cause kept open</text>

    <line x1="240" y1="280" x2="276" y2="280" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="480" y1="280" x2="516" y2="280" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
    <line x1="720" y1="280" x2="756" y2="280" stroke="#64748B" stroke-width="1.6" marker-end="url(#arrow)"/>
  </g>

  <!-- Feedback loops -->
  <path d="M380,324 C380,352 170,352 170,328" fill="none" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-violet)"/>
  <text x="275" y="362" font-size="12" fill="#7C3AED" text-anchor="middle">more evidence requested</text>
  <path d="M620,324 C620,392 110,392 110,328" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <text x="430" y="397" font-size="12" fill="#DC2626" text-anchor="middle">failed check: revise</text>

  <!-- Ledger band -->
  <rect x="40" y="414" width="920" height="34" rx="10" fill="#F1F5F9" stroke="#CBD5E1"/>
  <text x="500" y="436" font-size="12.5" fill="#334155" text-anchor="middle"><tspan font-weight="700">Durable ledger</tspan>  ·  every tool request, model call and dollar is reserved before it runs  ·  resume never resets a budget</text>
</svg>
